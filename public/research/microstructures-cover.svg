<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Porous electrode particles with lithium-ion flow">
<defs>
<linearGradient id="cellSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".45" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0d316f"/></linearGradient>
<linearGradient id="tray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0d316f"/></linearGradient>
<radialGradient id="sphere" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#bae6fd"/><stop offset=".45" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0d316f"/></radialGradient>
<linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0d316f"/></linearGradient>
<linearGradient id="heatbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0d316f" flood-opacity=".22"/></filter>
<filter id="card"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0d316f" flood-opacity=".06"/></filter>
<style>
.panel{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}
.t{font-family:Pretendard Variable, Inter, system-ui, sans-serif;font-size:17px;font-weight:700;fill:#0d316f}
.l{font-family:Pretendard Variable, Inter, system-ui, sans-serif;font-size:11px;fill:#64748b}
.ax{stroke:#cbd5e1;stroke-width:1.5}
</style>
</defs>
<g transform="translate(50 45) scale(1 1.05)"><g filter="url(#sh)">
<circle cx="60" cy="70" r="40" fill="url(#sphere)"/>
<circle cx="150" cy="120" r="52" fill="url(#sphere)"/>
<circle cx="250" cy="70" r="34" fill="url(#sphere)"/>
<circle cx="330" cy="140" r="48" fill="url(#sphere)"/>
<circle cx="430" cy="80" r="42" fill="url(#sphere)"/>
<circle cx="500" cy="150" r="40" fill="url(#sphere)"/>
<circle cx="70" cy="200" r="44" fill="url(#sphere)"/>
<circle cx="190" cy="240" r="40" fill="url(#sphere)"/>
<circle cx="290" cy="260" r="52" fill="url(#sphere)"/>
<circle cx="410" cy="220" r="36" fill="url(#sphere)"/>
<circle cx="480" cy="280" r="34" fill="url(#sphere)"/>
<circle cx="120" cy="320" r="36" fill="url(#sphere)"/>
<circle cx="260" cy="340" r="30" fill="url(#sphere)"/>
<circle cx="380" cy="330" r="42" fill="url(#sphere)"/>
</g>
<g fill="none" stroke="#00abe9" stroke-width="3" stroke-linecap="round"><path d="M0 150 C 60 130, 100 200, 180 180 S 280 110, 360 180 S 460 240, 500 200"/><path d="M0 290 C 70 310, 120 270, 200 300 S 320 320, 400 280 S 480 220, 500 260" opacity=".7"/></g>
<g fill="#fff" stroke="#026fc1" stroke-width="2"><circle cx="180" cy="180" r="5"/><circle cx="360" cy="180" r="5"/><circle cx="400" cy="280" r="5"/></g></g>
</svg>
